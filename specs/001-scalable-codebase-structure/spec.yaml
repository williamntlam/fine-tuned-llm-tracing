id: "001-scalable-codebase-structure"
title: "Scalable codebase structure"
status: "draft"
owner: null
created: "2026-08-23"
updated: "2026-08-24"

summary: "Establish a framework-unopinionated Python layered architecture with explicit typed contracts, Pyright strict checking, a target directory scaffold, and documented pattern purpose, application, and value."

links:
  spec: "spec.md"
  artifacts: "artifacts.md"
  issue: null
  pull_request: null

scope:
  in_scope:
    - "Python package and test directory structure"
    - "Explicit target repository tree with representative first-slice module locations"
    - "Named typed data contracts and static type-checking enforcement"
    - "Ignored local .env and placeholder-only .env.example provider-secret convention"
    - "Layered dependency boundaries and composition roots"
    - "Ports/adapters, use cases, factories, and provider integration guidance"
    - "Fine-tuning context for OpenAI and open-weight Qwen across SFT, DPO, and reinforcement methods"
    - "Decorator-based cross-cutting provider behavior and explicit pattern deferrals"
    - "Implemented-pattern guide covering ports/adapters, use cases, factories, decorators, commands, and strategies"
    - "Architecture, configuration, and developer documentation"
  out_of_scope:
    - "Dataset, training, serving, or tracking implementations"
    - "Production provider, database, cloud, or CI selection"
    - "Premature microservice or plugin architecture"

interfaces:
  - "Domain incident and diagnosis result contracts"
  - "Application ports for model, storage, tracking, and telemetry dependencies"
  - "Provider-neutral inference and fine-tuning ports"
  - "OpenAI API and Hugging Face Qwen adapters selected at the composition root"
  - "Composable decorators for provider telemetry, retries, rate limits, and redaction"
  - "Interface-boundary transport schemas"
  - "Named typed domain, use-case, port, settings, persistence, and transport contracts"
  - "Environment variables: OPENAI_API_KEY and optional HF_TOKEN"
  - "Typed provider and training-method selection for SFT, DPO, and reinforcement fine-tuning"

dependencies:
  - "Python packaging, test, and lint tool selection"
  - "Pyright with strict type-checking mode"

acceptance_criteria:
  - "Layered src package, test tiers, scripts, and configs are present."
  - "Domain and application do not import infrastructure or interfaces."
  - "A use case runs with an in-memory fake adapter in an offline unit test."
  - "Composition roots select adapters without changing use-case code."
  - "Inference and fine-tuning use cases select OpenAI API or Hugging Face Qwen adapters without application-code changes."
  - "Offline contract tests verify normalized provider adapter behavior."
  - "Decorators wrap provider adapters without changing application use cases."
  - "Public contracts and core data types are annotated; external untyped payloads are translated at boundaries."
  - "Pyright strict mode passes for src and tests."
  - ".env.example contains empty OPENAI_API_KEY and optional HF_TOKEN; .env is Git-ignored."
  - "Architecture and developer documentation describe extension conventions."
  - "Architecture documentation records which design patterns are implemented or deferred."
  - "Artifacts and secrets are excluded and documented."

verification:
  commands: []
  notes:
    - "Populate selected packaging, lint, test, and Pyright commands during implementation."
    - "Verify the unit tier without credentials, network access, or GPU access."
